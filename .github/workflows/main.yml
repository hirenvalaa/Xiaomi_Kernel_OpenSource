name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison libglib2.0-dev gcc-aarch64-linux-gnu clang lld

    - name: Compile Kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 defconfig
        
        # Disable problematic modules
        scripts/config --disable CONFIG_QRTR_TUN
        scripts/config --disable CONFIG_QRTR
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -w" -j$(nproc)

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: arch/arm64/boot/Image.gz-dtb
        
