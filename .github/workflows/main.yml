name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison libglib2.0-dev gcc-aarch64-linux-gnu

    - name: Compile Kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
        
        # Disable problematic sub-systems and MMC ICE driver error
        scripts/config --disable CONFIG_QRTR
        scripts/config --disable CONFIG_QRTR_TUN
        scripts/config --disable CONFIG_COMMON_CLK_QCOM
        scripts/config --disable CONFIG_DRM
        scripts/config --disable CONFIG_MMC_SDHCI_MSM_ICE
        
        # Enable Bluetooth for NetHunter
        scripts/config --enable CONFIG_BT
        scripts/config --enable CONFIG_BT_RFCOMM
        scripts/config --enable CONFIG_BT_BNEP
        scripts/config --enable CONFIG_BT_HIDP
        scripts/config --enable CONFIG_BT_HCIBTUSB
        
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w -fcommon" -j$(nproc) Image.gz-dtb || make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w -fcommon" -j$(nproc) Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: arch/arm64/boot/
