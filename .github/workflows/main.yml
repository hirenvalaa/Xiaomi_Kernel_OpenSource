name: Build Kernel for Poco Pad 5G (ruan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison libglib2.0-dev git wget

    - name: Download Clang & GCC Toolchains
      run: |
        mkdir -p clang
        cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz
        cd ..
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

    - name: Compile Kernel
      run: |
        export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
        
        # Try ruan defconfig options
        if [ -f arch/arm64/configs/vendor/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- vendor/ruan_defconfig
        elif [ -f arch/arm64/configs/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- ruan_defconfig
        else
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- defconfig
        fi
        
        # Enable Bluetooth modules for NetHunter
        scripts/config --enable CONFIG_BT
        scripts/config --enable CONFIG_BT_RFCOMM
        scripts/config --enable CONFIG_BT_BNEP
        scripts/config --enable CONFIG_BT_HIDP
        scripts/config --enable CONFIG_BT_HCIBTUSB
        
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- olddefconfig
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- -j$(nproc)

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: arch/arm64/boot/
