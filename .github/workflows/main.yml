name: Build Kernel for Poco Pad 5G (ruan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison libglib2.0-dev clang-12 llvm-12 lld-12 gcc-aarch64-linux-gnu

    - name: Hard-Patch Broken Xiaomi Code
      run: |
        # 1. Fix sdhci-msm.c ICE driver issues
        sed -i 's/return 0;/return;/g' drivers/mmc/host/sdhci-msm.c || true
        sed -i '2824s/.*/return;/' drivers/mmc/host/sdhci-msm.c || true
        sed -i 's/mmio_data.ice_base_mmio = msm_host->ice_mem;/\/\/ bypassed/g' drivers/mmc/host/sdhci-msm.c || true
        sed -i 's/mmio_data.ice_hwkm_mmio = msm_host->ice_hwkm_mem;/\/\/ bypassed/g' drivers/mmc/host/sdhci-msm.c || true
        sed -i '3858s/.*/\/\/ bypassed/' drivers/mmc/host/sdhci-msm.c || true
        sed -i '3859s/.*/\/\/ bypassed/' drivers/mmc/host/sdhci-msm.c || true
        
        # 2. Fix clk-debug.c by creating a dummy trace.h header (No syntax errors!)
        cat << 'EOF' > drivers/clk/qcom/trace.h
        #ifndef __QCOM_CLK_TRACE_H__
        #define __QCOM_CLK_TRACE_H__
        #define trace_clk_measure(...)
        #define trace_clk_state(...)
        #endif
        EOF

    - name: Compile Kernel
      run: |
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-12 100
        
        # Select target defconfig
        if [ -f arch/arm64/configs/vendor/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- vendor/ruan_defconfig
        elif [ -f arch/arm64/configs/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- ruan_defconfig
        else
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- defconfig
        fi
        
        # Fix missing qcom_scm Linker Error
        scripts/config --enable CONFIG_QCOM_SCM
        scripts/config --disable CONFIG_MMC_SDHCI_MSM_ICE
        
        # Enable Bluetooth modules for NetHunter
        scripts/config --enable CONFIG_BT
        scripts/config --enable CONFIG_BT_RFCOMM
        scripts/config --enable CONFIG_BT_BNEP
        scripts/config --enable CONFIG_BT_HIDP
        scripts/config --enable CONFIG_BT_HCIBTUSB
        
        # Compile with strict warnings disabled
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w -Wno-return-type" -j$(nproc) Image.gz-dtb || make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w -Wno-return-type" -j$(nproc) Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: arch/arm64/boot/
        
