name: Build Kernel for Poco Pad 5G (ruan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update -qq
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev libelf-dev flex bison libglib2.0-dev git wget Clang llvm

    - name: Set up Clang Toolchain
      uses: Linuxing3/setup-clang-action@v1
      with:
        version: '12.0.1'

    - name: Compile Kernel
      run: |
        # Try ruan defconfig options
        if [ -f arch/arm64/configs/vendor/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- vendor/ruan_defconfig
        elif [ -f arch/arm64/configs/ruan_defconfig ]; then
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- ruan_defconfig
        else
            make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- defconfig
        fi
        
        # Enable Bluetooth modules for NetHunter
        scripts/config --enable CONFIG_BT
        scripts/config --enable CONFIG_BT_RFCOMM
        scripts/config --enable CONFIG_BT_BNEP
        scripts/config --enable CONFIG_BT_HIDP
        scripts/config --enable CONFIG_BT_HCIBTUSB
        
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w" -j$(nproc) Image.gz-dtb || make ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- WERROR=0 KCFLAGS="-w" -j$(nproc) Image

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: arch/arm64/boot/
        
